[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterx-monitor-cli"
version = "2.1.2"
description = "Clusterx Monitor and safe Clusterx user client"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "rich>=13,<15",
]

[project.scripts]
clusterx-monitor-cli = "clusterx_monitor_cli.monitor_cli:main"
clusterx-exec = "clusterx_monitor_cli.clusterx_exec:main"
clusterx-preflight = "clusterx_monitor_cli.preflight:main"
clusterx-redact = "clusterx_monitor_cli.redact:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clusterx_monitor_cli_assets = ["resource-policy.json"]
